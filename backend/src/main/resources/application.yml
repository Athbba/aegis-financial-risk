spring:
  application:
    name: aegis
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${DATABASE_USERNAME:aegis}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      maximum-pool-size: 10
      pool-name: aegis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
    connection-timeout: 10s
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
# Single-instance operations credentials are separate from application users.
aegis:
  seed-data: ${AEGIS_SEED_DATA:true}
  operations:
    password-hash: ${AEGIS_OPERATIONS_PASSWORD_HASH:}
