name: Verify AEGIS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend unit and PostgreSQL integration tests
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Frontend type check and production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start actual application stack
        run: |
          ./scripts/init-local.sh
          docker compose up -d --wait db
          docker compose -f compose.yml -f compose.prebuilt.yml up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health && curl --fail --silent http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs --tail=100
          exit 1
      - name: Desktop and mobile browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
            frontend/playwright-report/
            /tmp/aegis-backend.log
            /tmp/aegis-frontend.log
