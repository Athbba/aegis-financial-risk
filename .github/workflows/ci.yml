name: Verify AEGIS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: aegis-ci-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend unit and PostgreSQL integration tests
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Frontend type check and production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start actual application stack
        run: |
          ./scripts/init-local.sh
          docker compose up -d --wait db
          docker compose -f compose.yml -f compose.prebuilt.yml up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health && curl --fail --silent http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs --tail=100
          exit 1
      - name: Desktop and mobile browser journeys
        working-directory: frontend
        run: AEGIS_E2E_RESTART_BACKEND=true npm run test:e2e
      - name: Sanitized failure counts
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,xml.etree.ElementTree as E
          suites=[]
          for p in pathlib.Path('backend/target/surefire-reports').glob('TEST-*.xml'):
              a=E.parse(p).getroot().attrib
              suites.append({k:a.get(k) for k in ['name','tests','failures','errors','skipped']})
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'aegis-regression-summary.json'
          p.write_text(json.dumps({'backend':suites,'note':'Raw reports/traces/cookies/dumps excluded'},indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure-counts
          path: ${{ runner.temp }}/aegis-regression-summary.json
  release-rehearsal:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build verified contracts and deployment fixtures
        run: |
          mvn -B -ntp -f backend/pom.xml -DskipTests package dependency:list -DoutputFile=${{ runner.temp }}/aegis-java-dependencies.txt
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend run format:check
          npm --prefix frontend audit --audit-level=low
          python3 -m unittest discover -s scripts/tests
      - name: Exact Java advisories including test dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aegis-evidence"
          python3 scripts/check-java-advisories.py "$RUNNER_TEMP/aegis-java-dependencies.txt" --output "$RUNNER_TEMP/aegis-evidence/java-audit.json"
      - name: Verified scanners and source/history secret checks
        run: |
          scripts/install-release-scanners.sh "$RUNNER_TEMP/aegis-scanners"
          "$RUNNER_TEMP/aegis-scanners/gitleaks" git . --redact --exit-code 1
          git archive HEAD | tar -x -C "$(mkdir -p "$RUNNER_TEMP/aegis-source"; echo "$RUNNER_TEMP/aegis-source")"
          "$RUNNER_TEMP/aegis-scanners/gitleaks" dir "$RUNNER_TEMP/aegis-source" --redact --exit-code 1
      - name: Trusted browser dependencies
        working-directory: frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools gnupg
          npx playwright install --with-deps chromium
      - name: Isolated HTTPS privilege, browser, proxy, outage, encrypted restore and rollback gates
        env:
          TRIVY: ${{ runner.temp }}/aegis-scanners/trivy
        run: scripts/ci-deployment.sh "$RUNNER_TEMP/aegis-private" "$RUNNER_TEMP/aegis-evidence"
      - name: Safe release artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/aegis-evidence/*-scan.json
            ${{ runner.temp }}/aegis-evidence/*-sbom.json
            ${{ runner.temp }}/aegis-evidence/*-oci.tar
            ${{ runner.temp }}/aegis-evidence/manifest.json
            ${{ runner.temp }}/aegis-evidence/rollback.json
            ${{ runner.temp }}/aegis-evidence/rollback-scanner-version.json
            ${{ runner.temp }}/aegis-evidence/scanner-version.json
            ${{ runner.temp }}/aegis-evidence/gate.json
            ${{ runner.temp }}/aegis-evidence/java-audit.json
            ${{ runner.temp }}/aegis-evidence/load.json
            ${{ runner.temp }}/aegis-evidence/controls.json
            ${{ runner.temp }}/aegis-evidence/recovery.json
            ${{ runner.temp }}/aegis-evidence/enrollment.json
            ${{ runner.temp }}/aegis-evidence/upgrade.json
            ${{ runner.temp }}/aegis-evidence/configuration*.json
            ${{ runner.temp }}/aegis-evidence/*.png
