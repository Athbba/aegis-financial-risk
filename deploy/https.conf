log_format aegis_safe escape=json '{"event":"proxy_request","method":"$request_method","status":$status,"duration":$request_time,"requestId":"$upstream_http_x_request_id"}';
server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}
server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls-cert;
    ssl_certificate_key /run/secrets/tls-key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout aegis_safe;
    error_log /dev/stderr crit;
    error_page 413 = @payload_too_large;
    client_max_body_size 64k;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"code":"REQUEST_TOO_LARGE","detail":"JSON requests must not exceed 64 KiB."}';
    }
    location /actuator/ { return 404; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Aegis-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
